<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

body { background: #000; width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
.video-wrap { position: relative; width: 100%; padding-top: 56.25%; }

</style>
</head>
<body>
<div class="video-wrap">
<iframe src="https://www.youtube.com/embed/inpok4MKVLM?rel=0&playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
</div>
</body>
</html>
